<div class="flex flex-col gap-4 mx-6 md:mx-20 mt-5">
    <div class="flex items-center justify-between bg-white p-4 rounded-xl w-full">

        <div>
            <h1 class="text-2xl sm:text-4xl  font-semibold">TaskFlow</h1>
            <p class="text-gray-600">Organize your day, beautifully</p>
        </div>

        <button class="p-2 rounded-full hover:bg-gray-100 transition cursor-pointer">
            <lucide-icon [img]="Moon" [size]="22"></lucide-icon>
        </button>

    </div>

    <div class="bg-white p-5 rounded-xl w-full">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h2 class="text-lg font-semibold">Your Progress</h2>
            <p class="text-sm text-gray-500">1 of 3 tasks completed</p>
        </div>

        <div class="w-full bg-gray-200 rounded-full h-2">
            <div class="bg-purple-600 h-2 rounded-full w-1/3"></div>
        </div>

        <div class="flex gap-8 mt-5">
            <div>
                <p class="text-xl font-semibold">2</p>
                <p class="text-xs text-gray-400 uppercase font-semibold">Pending</p>
            </div>

            <div>
                <p class="text-xl font-semibold">1</p>
                <p class="text-xs text-gray-400 uppercase font-semibold">Completed</p>
            </div>

        </div>
    </div>
</div>
